<style>
:root{--md-sys-color-primary:#1B6B51;--md-sys-color-on-primary:#fff;--md-sys-color-primary-container:#A6F2D1;--md-sys-color-surface:#F5FBF6;--md-sys-color-surface-container-low:#EFF5F0;--md-sys-color-surface-container:#E9EFEA;--md-sys-color-surface-container-high:#E3EAE5;--md-sys-color-surface-container-highest:#DDE4DF;--md-sys-color-on-surface:#171D1A;--md-sys-color-outline-variant:#BFC9C2;--spring-curve:cubic-bezier(.2,.82,.2,1);--ease-out:cubic-bezier(.16,1,.3,1)}

.ab:active{transform:scale(.94)}.ab:disabled{opacity:.5;cursor:progress}
.ab.pri{color:#fff;background:linear-gradient(120deg,#ff2d7a,#ff9a3d)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));z-index:300;max-width:min(92vw,420px);transform:translate(-50%,30px);opacity:0;padding:12px 18px;border-radius:99px;font:700 13px/1.3 Inter,sans-serif;color:#fff;text-align:center;background:rgba(25,25,28,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .45s var(--spring-curve),opacity .3s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.nl-back,.glass-modal-backdrop{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media(prefers-reduced-motion:reduce){.bg i{animation:none}}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}

.pol{position:relative;padding:9px 9px 12px;border-radius:14px;background:#fbf7ea;color:#2B2615;box-shadow:0 14px 26px -14px rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.08);animation:polIn .6s var(--spring-curve) both;animation-delay:calc(var(--i,0)*60ms)}
.pol:nth-child(odd){transform:rotate(-1.2deg)}.pol:nth-child(even){transform:rotate(1deg)}

.viewer{position:fixed;inset:0;z-index:250;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.82);cursor:zoom-out;animation:vIn .3s ease both}
.viewer img{max-width:100%;max-height:100%;border-radius:14px;animation:vImg .5s var(--spring-curve) both}
@keyframes vIn{from{opacity:0}}@keyframes vImg{from{transform:scale(.75) rotate(-5deg);opacity:0}}

<script>

(function(){
const PS=24;

const $=id=>document.getElementById(id);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const cfg=()=>{const c=window.XIA_CONFIG||{};return (c.SUPABASE_URL&&!/YOUR_/.test(c.SUPABASE_URL)&&c.SUPABASE_ANON_KEY&&!/^YOUR_/.test(c.SUPABASE_ANON_KEY))?c:null};
const client=()=>{const c=cfg();if(!c||!window.supabase)return null;return window.__xiaSb=window.__xiaSb||window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}})};
const dev=(()=>{try{let d=localStorage.getItem('xia_dev');if(!d){d=((crypto.randomUUID&&crypto.randomUUID())||(Math.random().toString(36).slice(2)+Date.now().toString(36)+'abcdefgh')).replace(/-/g,'');localStorage.setItem('xia_dev',d)}return d}catch(_){return 'tmp'+Math.random().toString(36).slice(2,12)+'xyz'}})();
const retrig=(e,c)=>{e.classList.remove(c);void e.offsetWidth;e.classList.add(c)};
const BRAND='XI.2 Creative Lab';
const HOME=new URL('../',location.href).href;
const HOST=location.host;
const IC_LINK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1 0l3-3a5 5 0 0 0-7.1-7.1l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.1 0l-3 3a5 5 0 0 0 7.1 7.1l1.7-1.7"/></svg>';
const IC_IG='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>';
let toastT=0;
const toast=t=>{let e=$('toast');if(!e){e=h('div','toast');e.id='toast';e.setAttribute('role','status');document.body.appendChild(e)}e.textContent=t;void e.offsetWidth;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),3600)};
const btn=(cls,ico,txt,fn)=>{const b=h('button','ab '+cls);b.type='button';b.innerHTML=ico+'<span></span>';b.lastChild.textContent=txt;b.onclick=()=>fn(b);return b};
/* bagikan link: share sheet bawaan HP, cadangan salin ke clipboard */
const shareLink=async(url,text)=>{
 if(navigator.share){try{await navigator.share({title:BRAND,text:text,url:url});return}catch(e){if(e&&e.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(url);toast('Link disalin: '+url)}catch(_){window.prompt('Salin link ini:',url)}};
/* canvas helpers */
const rr=(g,x,y,w,hh,r)=>{g.beginPath();if(g.roundRect){g.roundRect(x,y,w,hh,r)}else{r=Math.min(r,w/2,hh/2);g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+hh,r);g.arcTo(x+w,y+hh,x,y+hh,r);g.arcTo(x,y+hh,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}};
const wrap=(g,text,maxW)=>{const out=[];String(text).split('\n').forEach(par=>{let line='';const words=par.split(/\s+/).filter(Boolean);if(!words.length){out.push('');return}
 words.forEach(w=>{while(g.measureText(w).width>maxW){let k=w.length;while(k>1&&g.measureText(w.slice(0,k)).width>maxW)k--;if(line){out.push(line);line=''}out.push(w.slice(0,k));w=w.slice(k)}
  const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});out.push(line)});return out};
const clip=(lines,n)=>{if(lines.length<=n)return lines;const o=lines.slice(0,n);o[n-1]=o[n-1].replace(/\s+$/,'').slice(0,-1)+'…';return o};
const fontsReady=async()=>{try{await Promise.all(['800 60px "Bricolage Grotesque"','700 30px "Space Grotesk"','600 40px Inter'].map(f=>document.fonts.load(f)))}catch(_){}};
const loadImg=u=>new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=u});
/* kirim hasil: share sheet (file) -> IG Story; cadangan unduh PNG */
const deliver=async(cv,name,link)=>{
 const blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(!blob)throw new Error('blob');
 const f=new File([blob],name,{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:BRAND});toast('Pilih Story Instagram. Link sudah disalin untuk stiker Link.');window.PiwoMini&&PiwoMini.say('Keren! Jangan lupa tag temen-temenmu~');return}catch(e){if(e&&e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
 toast('Gambar tersimpan. Buka Instagram, buat Story, pilih gambar ini, lalu tempel link di stiker Link.')};
const copyQuiet=t=>{try{navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{})}catch(_){}};

const LINK=new URL('./',location.href).href;
const dstr=d=>new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Jakarta'});
const stampOf=d=>{const p=new Date(d).toLocaleDateString('sv-SE',{timeZone:'Asia/Jakarta'});return "'"+p.slice(2).replace(/-/g,' ')};
const urlOf=p=>client().storage.from('moments').getPublicUrl(p).data.publicUrl;
const viewer=src=>{const v=h('div','viewer');v.setAttribute('role','dialog');v.setAttribute('aria-modal','true');
 const i=h('img');i.src=src;i.alt='Momen kelas';v.appendChild(i);const off=()=>{v.remove();document.removeEventListener('keydown',k)},k=e=>{if(e.key==='Escape')off()};v.onclick=off;document.addEventListener('keydown',k);document.body.appendChild(v)};

/* template Story IG 1080x1920: polaroid di tengah, nama web di atas & bawah */
const story=async(x,u,b)=>{b.disabled=true;copyQuiet(LINK);window.PiwoMini&&PiwoMini.say('Bentar, aku siapin template Story-nya~');
 try{await fontsReady();const img=await loadImg(u);
  const W=1080,H=1920,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0D3F2E');bg.addColorStop(.6,'#1B6B51');bg.addColorStop(1,'#2fa57d');g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(255,255,255,.07)';[[120,300,280],[980,820,190],[140,1580,230],[940,1500,140]].forEach(o=>{g.beginPath();g.arc(o[0],o[1],o[2],0,7);g.fill()});
  /* brand atas */
  g.textAlign='center';g.textBaseline='middle';g.font='700 34px "Space Grotesk",Inter,sans-serif';const bt=BRAND.toUpperCase(),bw=g.measureText(bt).width+84;
  g.fillStyle='rgba(255,255,255,.93)';rr(g,(W-bw)/2,190,bw,88,44);g.fill();g.fillStyle='#0D3F2E';g.fillText(bt,W/2,190+44+2);
  /* polaroid */
  const PW=860,PX=(W-PW)/2,PADp=40,IW=PW-PADp*2,IH=Math.round(IW*1.25),PH=PADp+IH+150,PY=Math.round((H-PH)/2)+10;
  g.save();g.translate(W/2,PY+PH/2);g.rotate(-3*Math.PI/180);g.translate(-W/2,-(PY+PH/2));
  g.save();g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=70;g.shadowOffsetY=30;g.fillStyle='#fbf7ea';rr(g,PX,PY,PW,PH,28);g.fill();g.restore();
  g.save();rr(g,PX+PADp,PY+PADp,IW,IH,14);g.clip();
  const ar=IW/IH,ir=img.naturalWidth/img.naturalHeight;let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
  if(ir>ar){sw=Math.round(sh*ar);sx=Math.round((img.naturalWidth-sw)/2)}else{sh=Math.round(sw/ar);sy=Math.round((img.naturalHeight-sh)/2)}
  g.drawImage(img,sx,sy,sw,sh,PX+PADp,PY+PADp,IW,IH);g.restore();
  g.textAlign='left';g.fillStyle='#2B2615';g.font='800 52px "Bricolage Grotesque",Inter,sans-serif';g.textBaseline='alphabetic';g.fillText('Momen Kelas',PX+PADp,PY+PADp+IH+84);
  g.textAlign='right';g.fillStyle='#e8742a';g.font='700 38px "Space Grotesk",Inter,sans-serif';g.fillText(stampOf(x.created_at),PX+PW-PADp,PY+PADp+IH+82);
  g.restore();
  /* stiker Piwo mengintip dari pojok polaroid */
  try{const pw=await loadImg(new URL('../icons/piwo.png',location.href).href);g.save();g.translate(PX+PW-60,PY-5);g.rotate(10*Math.PI/180);g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=30;g.shadowOffsetY=12;g.drawImage(pw,-120,-120,240,240);g.restore()}catch(_){}
  /* link bawah */
  const lt=HOST+'/kamera';g.textAlign='center';g.textBaseline='middle';g.font='700 44px "Space Grotesk",Inter,sans-serif';const lw=g.measureText(lt).width+110,ly=H-330;
  g.fillStyle='#111';rr(g,(W-lw)/2,ly,lw,96,48);g.fill();g.fillStyle='#fff';g.fillText(lt,W/2,ly+48+2);
  g.fillStyle='rgba(255,255,255,.85)';g.font='600 34px Inter,sans-serif';g.fillText('lihat semua momen kelas kami',W/2,ly+96+52);
  await deliver(cv,'momen-kelas-xi2.png',LINK)
 }catch(_){toast('Gagal membuat gambar. Coba lagi ya.')}finally{b.disabled=false}};

let pg=0;
const tile=(x,i)=>{const u=urlOf(x.path),b=h('article','pol');b.style.setProperty('--i',Math.min(i,8));
 const ib=h('button','pol-img');ib.type='button';ib.setAttribute('aria-label','Perbesar foto');
 const im=h('img');im.crossOrigin='anonymous';im.src=u;im.loading='lazy';im.decoding='async';im.alt=x.caption||'Momen kelas';ib.appendChild(im);ib.onclick=()=>viewer(u);b.appendChild(ib);
 b.appendChild(h('div','pol-d',dstr(x.created_at)));
 const a=h('div','act');a.appendChild(btn('',IC_LINK,'Link',()=>shareLink(LINK,'Lihat momen kelas XI.2 di '+BRAND)));a.appendChild(btn('pri',IC_IG,'Story IG',bt=>story(x,u,bt)));b.appendChild(a);return b};
const load=async more=>{const c=client(),g=$('cam-grid');if(!c||!g)return;const mb=$('more');
 if(!more){pg=0;g.textContent=''}
 mb.disabled=true;
 const {data,error}=await c.from('class_moments').select('id,path,caption,created_at').eq('status','approved').order('created_at',{ascending:false}).range(pg*PS,pg*PS+PS-1);
 mb.disabled=false;
 if(error){if(!more)g.appendChild(h('p','empty','Galeri belum bisa dimuat.'));return}
 if(!data.length&&!more){g.appendChild(h('p','empty','Belum ada foto. Jadi yang pertama!'));mb.hidden=true;return}
 data.forEach((x,i)=>g.appendChild(tile(x,i)));pg++;mb.hidden=data.length<PS};

/* real-time: update otomatis saat admin menyetujui/menghapus */
let sig='';const sigOf=d=>(d||[]).map(x=>x.id+(x.reply||'')).join();
const poll=async()=>{if(document.hidden)return;const c=client();if(!c)return;try{const r=await c.from('class_moments').select('id').eq('status','approved').order('created_at',{ascending:false}).range(0,PS-1);if(r.error)return;const n=sigOf(r.data);if(sig&&n!==sig){load(false)}sig=n}catch(_){}};
const live=()=>{const c=client();if(!c||!c.channel)return;setInterval(poll,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});setTimeout(poll,3000);let t=0;try{c.channel('pub-class_moments').on('postgres_changes',{event:'*',schema:'public',table:'class_moments'},()=>{clearTimeout(t);t=setTimeout(()=>{load(false)},700)}).subscribe()}catch(_){}};
const init=()=>{live();$('more').onclick=()=>load(true);load(false)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
